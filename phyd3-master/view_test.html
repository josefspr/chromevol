<!DOCTYPE html>
<html lang="en" xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta content="text/html;charset=UTF-8" http-equiv="content-type">
    <title>PhyD3</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css" integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/icon?family=Material+Icons">
    <script src="https://code.jquery.com/jquery-2.2.4.min.js" integrity="sha256-BbhdlvQf/xTY9gja0Dq3HiwQF8LaCRTXxZKRutelT44=" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa" crossorigin="anonymous"></script>
    <script src="https://d3js.org/d3.v3.min.js"></script>
    <!--<script src="libs/js/material.min.js"></script>-->
    <script src="dist/js/phyd3.min.js" type="text/javascript"></script>
    <script>
        jQuery.noConflict();
        (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
            (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
            m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
        })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
        ga('create', 'UA-61194136-8', 'auto');
        ga('send', 'pageview');

        var opts = {
            dynamicHide: true,
            height: 800,
            invertColors: false,
            lineupNodes: true,
            showDomains: true,
            showDomainNames: false,
            showDomainColors: true,
            nodeHeight: 10,
            scaleX: 1,
            scaleY: 1,
            translateX: 0,
            showGraphs: true,
            showGraphLegend: true,
            showSupportValues: false,
            maxDecimalsSupportValues: 1,
            showLengthValues: false,
            maxDecimalsLengthValues: 3,
            showLength: false,
            showNodeNames: true,
            showNodesType: "all",
            showPhylogram: true,
            showTaxonomy: true,
            showFullTaxonomy: true,
            showSequences: false,
            showTaxonomyColors: true,
            branchColorDefault: "#909090",
            showBranchColors: true,
            backgroundColor: "#f5f5f5",
            foregroundColor: "#000000",
        };

        function load() {
            loadTree();
        }
        function loadTree() {
            d3.select("#phyd3").html("Loading...<br /><br />");
            var pid = getParameterByName('pid');
            var model =getParameterByName('model');
            var fid = pid + '/ChromEvol_Tree_1/' + model;
            d3.xml("results/" + fid + "/MLAncestralReconstruction_phylo_edit", function(xml) {
                d3.select("#phyd3").text(null);
                var tree = phyd3.phyloxml.parse(xml);
                phyd3.phylogram.build("#phyd3", tree, opts);
            });
        };
        function getParameterByName(name, url = window.location.href) {
            name = name.replace(/[\[\]]/g, '\\$&');
            var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
                results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }
    </script>
</head>
<body onload="load()" style="background-color:#f5f5f5;">
    <br />
    <div>
        <div id="phyd3">
        </div>
    </div>
</body>
</html>
