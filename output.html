<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Sincopa — input files</title>
<style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:0 20px}li{margin:18px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f3f3;padding:20px}</style>
<h1>Input files</h1>
<ul id="files"></ul>
<pre id="preview" hidden></pre>
<p><a href="index.html">Prepare another input</a></p>
<script>
const input = JSON.parse(sessionStorage.getItem('sincopaInput'));
const fileContents = [
  ['TreesFile.txt', input.tree],
  ['countsFile', input.counts],
  ['params.txt', input.params],
  [input.nativeFilename, input.nativeParams]
];
const urls = [];
for (const [name, content] of fileContents) {
  const url = URL.createObjectURL(new Blob([content], {type: 'text/plain;charset=utf-8'}));
  urls.push(url);
  const row = document.createElement('li');
  const view = document.createElement('a');
  view.href = url;
  view.textContent = 'Display ' + name;
  view.addEventListener('click', event => {
    event.preventDefault();
    document.getElementById('preview').hidden = false;
    document.getElementById('preview').textContent = content;
  });
  const download = document.createElement('a');
  download.href = url;
  download.download = name;
  download.textContent = 'Download';
  row.append(view, ' — ', download);
  document.getElementById('files').append(row);
}
window.addEventListener('pagehide', () => urls.forEach(url => URL.revokeObjectURL(url)));
</script>
</html>
