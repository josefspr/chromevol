<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Sincopa — model comparison</title>
<style>body{font:16px system-ui;max-width:1200px;margin:35px auto;padding:0 20px}li{margin:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f3f3;padding:16px;max-height:400px;overflow:auto}button{padding:10px;margin:5px}table{border-collapse:collapse;width:100%}td,th{padding:10px;border:1px solid #ddd;text-align:left;white-space:nowrap}th{background:#f3f3f3}.scroll{overflow-x:auto}.best{background:#edf7ee}section{margin-top:24px}.note{color:#555}</style>
<h1>Homogeneous models</h1>
<details><summary>Input and parameter files</summary><ul id="files"></ul></details>
<button id="run">Run all defined models</button><button id="stop" disabled>Stop</button>
<p id="status" role="status">Ready.</p>
<h2>Model summary</h2>
<p id="comparisonNote" class="note">Models will be sorted by AICc, best first. Rates are rounded to two decimal places.</p>
<div class="scroll"><table id="summaryTable"></table></div>
<details><summary>Run log</summary><pre id="log"></pre></details>
<h2>Model outputs</h2><div id="modelOutputs"></div>
<h2 id="previewTitle" hidden>File contents</h2><pre id="preview" hidden></pre>
<p><a href="index.html">Prepare another input</a></p>
<script>
const input = JSON.parse(sessionStorage.getItem('sincopaInput'));
const nativeFiles = input?.nativeFiles || [];
const runButton = document.getElementById('run');
const stopButton = document.getElementById('stop');
const status = document.getElementById('status');
const log = document.getElementById('log');
const results = [];
const urls = [];
const xmlKeys = [];
let worker, cancelled = false, busy = false;
let rejectCurrent;
function fixPaths(text) {
  text = text.replace(/\r\n?/g, "\n");
  const paths = {
    _treeFile: '/input/TreesFile.txt',
    _dataFile: '/input/countsFile',
    _resultsPathDir: '/results'
  };
  for (const [key, value] of Object.entries(paths)) {
    const pattern = new RegExp('^[ \t]*' + key + '[ \t]*=[^\\n]*$', 'gm');
    if (pattern.test(text)) text = text.replace(pattern, key + ' = ' + value);
    else text += '\n' + key + ' = ' + value + '\n';
  }
  return text;
}
function summarizeHomogeneous(text) {
  let finalSection = false;
  let regimeCount = 1;
  const values = {};
  const functions = {};
  const numeric = '[+-]?(?:\\d+(?:\\.\\d*)?|\\.\\d+)(?:[eE][+-]?\\d+)?';
  const ratePattern = new RegExp(
    '^Chromosome\\.(baseNumR|dupl|gain|demi|loss)([01])_1\\s*=\\s*(' + numeric + ')\\s*$'
  );
  const basePattern = new RegExp('^Chromosome\\.baseNum_1\\s*=\\s*(' + numeric + ')\\s*$');
  for (const raw of text.replace(/\r\n?/g, '\n').split('\n')) {
    const line = raw.trim();
    const func = line.match(/^(baseNumR|dupl|gain|demi|loss):\s*(\w+)/);
    if (func) functions[func[1]] = func[2];
    const aicc = line.match(/^AICc of the best model\s*=\s*(.+)$/);
    if (aicc) values.aicc = aicc[1].trim();
    if (line.includes('Best chosen model') || line.includes('Final model parameters are:')) {
      finalSection = true;
    }
    if (line.includes('Previous best chosen models in the forward phase')) finalSection = false;
    const regimes = line.match(/Number of models in the best model\s*=\s*(\d+)/);
    if (regimes) regimeCount = Number(regimes[1]);
    if (!finalSection || line.startsWith('#')) continue;
    const rate = line.match(ratePattern);
    if (rate) values[rate[1] + rate[2]] = rate[3];
    const base = line.match(basePattern);
    if (base) values.baseNum = base[1];
  }
  if (regimeCount !== 1) throw new Error('Summary currently supports one homogeneous regime only.');
  if (Object.keys(values).length === 0) throw new Error('No final homogeneous parameters found in chromEvol.res.');
  function rateValue(key) {
    // Match Python's linear formatting for gain and loss.
    if ((key === 'gain' || key === 'loss') && values[key + '1'] !== undefined) {
      if (values[key + '0'] === undefined) return '-';
      const slope = Number(values[key + '1']).toFixed(2);
      const intercept = Number(values[key + '0']).toFixed(2);
      return 'LINEAR:' + slope + 'x' + (intercept === '0.00' ? '' : ' + ' + intercept);
    }
    const value = values[key + '0'];
    if (value === undefined) return '-';
    const formatted = Number(value).toFixed(2);
    return functions[key] === 'CONST' ? 'CONST:' + formatted : formatted;
  }
  return [
    ['Base (monoploid) number addition', rateValue('baseNumR')],
    ['Duplication', rateValue('dupl')],
    ['Ascending dysploidy', rateValue('gain')],
    ['Duplication by 1.5', rateValue('demi')],
    ['Descending dysploidy', rateValue('loss')],
    ['Base (monoploid) number', values.baseNum ?? '-'],
    ['AICc', values.aicc === undefined ? '-' : Number(values.aicc).toFixed(4)]
  ];
}
function convert_to_PhyD3(newick, countsText) {
  const counts = new Map();
  let taxon;
  for (const raw of countsText.split(/\r\n?|\n/)) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('>')) taxon = line.slice(1).trim();
    else if (taxon !== undefined) counts.set(taxon, line);
  }
  const text = newick.trim();
  let position = 0;
  function whitespace() { while (/\s/.test(text[position] || '') && position < text.length) position++; }
  function label() {
    whitespace();
    if (text[position] === "'") {
      position++;
      let value = '';
      while (position < text.length) {
        const character = text[position++];
        if (character === "'") {
          if (text[position] === "'") { value += "'"; position++; }
          else return value;
        } else value += character;
      }
      throw new Error('Unclosed quoted Newick label.');
    }
    const start = position;
    while (position < text.length && !/[\s(),:;\[\]]/.test(text[position])) position++;
    return text.slice(start, position);
  }
  function comment() {
    position++;
    let depth = 1, value = '';
    while (position < text.length && depth) {
      const character = text[position++];
      if (character === '[') depth++;
      if (character === ']') depth--;
      if (depth) value += character;
    }
    if (depth) throw new Error('Unclosed Newick comment.');
    return value.trim();
  }
  function subtree() {
    whitespace();
    const node = {name: '', children: []};
    if (text[position] === '(') {
      position++;
      node.children.push(subtree());
      whitespace();
      while (text[position] === ',') { position++; node.children.push(subtree()); whitespace(); }
      if (text[position++] !== ')') throw new Error('Missing Newick closing parenthesis.');
    }
    node.name = label();
    while (position < text.length) {
      whitespace();
      if (text[position] === '[') {
        const annotation = comment();
        // chromEvol can put ancestral node names in bracket comments.
        if (!node.name && /^N\d+(?:-\d+)?$/.test(annotation)) node.name = annotation;
      } else if (text[position] === ':') {
        position++;
        whitespace();
        const match = text.slice(position).match(/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/);
        if (!match) throw new Error('Invalid Newick branch length.');
        node.length = match[0];
        position += match[0].length;
      } else break;
    }
    return node;
  }
  const root = subtree();
  whitespace();
  if (text[position] === ';') position++;
  whitespace();
  if (position !== text.length) throw new Error('Unexpected content after the Newick tree.');
  function xml(value) {
    return String(value).replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;'
    })[character]);
  }
  function clade(node, depth) {
    const indent = '  '.repeat(depth);
    const lines = [indent + '<clade>'];
    if (node.name) {
      // Remove only chromEvol's numeric count suffix, preserving taxon hyphens.
      const name = counts.has(node.name) ? node.name : node.name.replace(/-\d+$/, '');
      lines.push(indent + '  <name>' + xml(name) + '</name>');
      lines.push(indent + '  <chrom>' + xml(counts.get(name) ?? ' - ') + '</chrom>');
    }
    if (node.length !== undefined) lines.push(indent + '  <branch_length>' + node.length + '</branch_length>');
    for (const child of node.children) lines.push(clade(child, depth + 1));
    lines.push(indent + '</clade>');
    return lines.join('\n');
  }
  // labels/chrom are the PhyD3 extensions used by the original Python function.
  return '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<phyloxml xmlns="http://www.phyloxml.org">\n' +
    '  <phylogeny rooted="false">\n' +
    '    <labels>\n' +
    '      <label type="text"><name show="1">Chromosome Count</name><data tag="chrom"/></label>\n' +
    '      <label type="color"><name>Color label</name><data tag="colortag"/></label>\n' +
    '    </labels>\n' + clade(root, 2) + '\n' +
    '  </phylogeny>\n</phyloxml>\n';
}
function textOf(bytes) {
  return typeof bytes === 'string' ? bytes : new TextDecoder().decode(bytes);
}
function linkFile(parent, name, bytes, label = name) {
  const url = URL.createObjectURL(new Blob([bytes], {type:'application/octet-stream'}));
  urls.push(url);
  const row = document.createElement('li');
  const display = document.createElement('a');
  display.href = url;
  display.textContent = label;
  display.onclick = event => {
    event.preventDefault();
    document.getElementById('previewTitle').hidden = false;
    document.getElementById('previewTitle').textContent = name;
    document.getElementById('preview').hidden = false;
    document.getElementById('preview').textContent = textOf(bytes);
  };
  const download = document.createElement('a');
  download.href = url; download.download = name; download.textContent = 'Download';
  row.append(display, ' — ', download); parent.append(row);
}
function parseRun(model, files, error) {
  const record = {...model, files, error, aicc:null, summary:null};
  const res = files.find(file => file.name === 'chromEvol.res');
  if (res) {
    try {
      const text = textOf(res.bytes);
      record.summary = summarizeHomogeneous(text);
      const matches = [...text.matchAll(/^\s*AICc of the best model\s*=\s*([+\-\d.eE]+)\s*$/gm)];
      const value = Number(matches.at(-1)?.[1]);
      // Failed runs remain visible, but do not enter the model ranking.
      if (!error && Number.isFinite(value)) record.aicc = value;
    } catch (parseError) {
      record.error = [error, 'Summary: ' + parseError.message].filter(Boolean).join('; ');
    }
  }
  return record;
}
function orderedResults() {
  return [...results].sort((a,b) =>
    (a.aicc ?? Infinity) - (b.aicc ?? Infinity) || a.id - b.id);
}
function renderResults() {
  const sorted = orderedResults();
  const best = sorted.find(record => record.aicc !== null)?.aicc;
  const table = document.getElementById('summaryTable');
  table.replaceChildren();
  if (!sorted.length) return;
  const thead = document.createElement('thead'), header = document.createElement('tr');
  const parameter = document.createElement('th'); parameter.textContent = 'Parameter'; header.append(parameter);
  sorted.forEach((record,index) => {
    const th = document.createElement('th'); th.scope = 'col';
    th.textContent = record.modelName + (index === 0 && record.aicc !== null ? (busy ? ' (best so far)' : ' (best)') : '');
    if (index === 0 && record.aicc !== null) th.className = 'best';
    header.append(th);
  });
  thead.append(header); table.append(thead);
  const labels = ['Base (monoploid) number addition','Duplication','Ascending dysploidy',
    'Duplication by 1.5','Descending dysploidy','Base (monoploid) number','ΔAICc from best model'];
  const tbody = document.createElement('tbody');
  labels.forEach((label,index) => {
    const row = document.createElement('tr'), th = document.createElement('th');
    th.scope = 'row'; th.textContent = label; row.append(th);
    sorted.forEach(record => {
      const td = document.createElement('td');
      td.textContent = index === 6 ? (record.aicc === null ? '-' : (record.aicc - best).toFixed(4)) :
        (record.summary?.[index]?.[1] ?? '-');
      row.append(td);
    });
    tbody.append(row);
  });
  table.append(tbody);
  document.getElementById('comparisonNote').textContent = busy ?
    'Comparison of completed models; the best model may change while remaining models run.' :
    'Best model first (lowest AICc). ΔAICc = model AICc − best AICc. Unreported parameters are shown as −.';
  // Rebuild just these four output entries for each model.
  const outputs = document.getElementById('modelOutputs'); outputs.replaceChildren();
  // Revoke links made for the previous results rendering; keep input links intact.
  for (const url of resultUrls) URL.revokeObjectURL(url);
  resultUrls.length = 0;
  for (const record of sorted) {
    const section = document.createElement('section'), title = document.createElement('h3');
    title.textContent = record.modelName; section.append(title);
    if (record.error) {
      const message = document.createElement('p'); message.textContent = 'Run failed: ' + record.error; section.append(message);
    }
    const list = document.createElement('ul');
    for (const filename of ['chromEvol.res','MLAncestralReconstruction_phylo.xml','ancestorsProbs.txt','expectations_second_round.txt']) {
      if (filename.endsWith('.xml')) {
        const row = document.createElement('li');
        if (record.xmlKey) {
          const link = document.createElement('a');
          link.href = 'view_ml.html?key=' + encodeURIComponent(record.xmlKey) + '&model=' + encodeURIComponent(record.modelName);
          // A new same-origin tab copies the XML session storage for this model.
          link.target = '_blank'; link.rel = 'opener';
          link.textContent = 'ML Ancestor Tree'; row.append(link);
        } else row.textContent = 'ML Ancestor Tree — unavailable';
        list.append(row);
      } else {
        const file = record.files.find(item => item.name === filename);
        if (file) {
          const before = urls.length;
          linkFile(list, filename, file.bytes);
          resultUrls.push(...urls.splice(before));
        } else {
          const row = document.createElement('li');row.textContent = filename + ' — not generated';list.append(row);
        }
      }
    }
    section.append(list); outputs.append(section);
  }
}
const resultUrls = [];
function executeModel(model) {
  return new Promise((resolve,reject) => {
    rejectCurrent = reject;
    worker = new Worker('chromevol-worker.js');
    worker.onerror = event => reject(new Error(event.message));
    worker.onmessage = ({data}) => {
      if (data.type === 'log') {
        log.textContent += '[' + model.modelName + '] ' + data.text + '\n'; log.scrollTop = log.scrollHeight;
      } else if (data.type === 'error') reject(new Error(data.text));
      else if (data.type === 'done') resolve(data);
    };
    worker.postMessage({tree:input.tree,counts:input.counts,params:fixPaths(model.params)});
  });
}
function clearRunData() {
  for (const key of xmlKeys) sessionStorage.removeItem(key);
  xmlKeys.length = 0;
}
runButton.onclick = async () => {
  cancelled = false; busy = true; runButton.disabled = true; stopButton.disabled = false;
  results.length = 0; clearRunData(); log.textContent = '';
  document.getElementById('summaryTable').replaceChildren();
  document.getElementById('modelOutputs').replaceChildren();
  document.getElementById('preview').hidden = true;
  document.getElementById('previewTitle').hidden = true;
  const runId = Date.now().toString(36);
  for (const [index,model] of nativeFiles.entries()) {
    if (cancelled) break;
    status.textContent = 'Running ' + (index+1) + '/' + nativeFiles.length + ': ' + model.modelName;
    let record;
    try {
      const data = await executeModel(model);
      const error = data.error || (data.code !== 0 ? 'Exit code ' + data.code : undefined);
      record = parseRun(model,data.files || [],error);
      const tree = record.files.find(file => file.name === 'MLAncestralReconstruction.tree');
      if (tree) {
        try {
          const xml = convert_to_PhyD3(textOf(tree.bytes),input.counts);
          const key = 'sincopaMLPhyloXML:' + runId + ':' + index;
          sessionStorage.setItem(key,xml); xmlKeys.push(key); record.xmlKey = key;
        } catch (error) { log.textContent += '[' + model.modelName + '] Tree conversion/viewer: ' + error.message + '\n'; }
      }
    } catch (error) {
      if (cancelled) break;
      record = parseRun(model,[],error.message);
    } finally {
      worker?.terminate(); worker = undefined; rejectCurrent = undefined;
    }
    results.push(record); renderResults();
  }
  busy = false; renderResults();
  runButton.disabled = false; stopButton.disabled = true;
  const failures = results.filter(record => record.error).length;
  status.textContent = (cancelled ? 'Stopped. ' : 'Finished. ') + results.length + '/' + nativeFiles.length +
    ' models completed' + (failures ? '; ' + failures + ' failed.' : '.');
};
stopButton.onclick = () => {
  cancelled = true; worker?.terminate(); rejectCurrent?.(new Error('Stopped'));
};
if (!nativeFiles.length) {
  status.textContent = 'Open index.html and submit again with the updated prepare.js to create parameters for all models.';
  runButton.disabled = true;
} else {
  const list = document.getElementById('files');
  for (const [name,content] of [['TreesFile.txt',input.tree],['countsFile',input.counts],['params.txt',input.params]]) linkFile(list,name,content);
  for (const model of nativeFiles) linkFile(list,model.filename,fixPaths(model.params));
}
window.addEventListener('pagehide', () => {
  worker?.terminate();
  [...urls,...resultUrls].forEach(url => URL.revokeObjectURL(url));
});
</script>
</html>
